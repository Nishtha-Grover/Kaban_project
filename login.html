<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | FlowForge</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" style="padding:32px;width:min(420px,94vw);border-radius:22px;">
            <a class="brand" href="index.html" style="justify-content:center;margin-bottom:24px;"><span class="brand-mark">F</span><span>FlowForge</span></a>
            <div style="text-align:center;margin-bottom:24px;">
                <span class="eyebrow">WELCOME BACK</span>
                <h2 style="margin:8px 0 6px;">Log in to your workspace</h2>
                <p style="margin:0;color:var(--muted);font-size:12px;">Your tasks are saved locally for your account.</p>
            </div>
            <form id="login-form" style="display:grid;gap:14px;">
                <div class="form-group"><label for="username">Username</label><input type="text" id="username" required autocomplete="username" placeholder="Enter username"></div>
                <div class="form-group"><label for="password">Password</label><input type="password" id="password" required autocomplete="current-password" placeholder="Enter password"></div>
                <div id="auth-error" class="error-msg hidden"></div>
                <button type="submit" class="primary" style="width:100%;">Log in</button>
            </form>
            <p style="text-align:center;margin:18px 0 0;color:var(--muted);font-size:12px;">New to FlowForge? <a href="signup.html" style="color:var(--primary);font-weight:700;">Create account</a></p>
        </div>
    </div>

    <script type="module">
        import { requireNoAuth, loginUser } from './js/auth.js';
        requireNoAuth();
        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('auth-error');
        form.addEventListener('submit', event => {
            event.preventDefault();
            errorMsg.classList.add('hidden');
            const result = loginUser(document.getElementById('username').value, document.getElementById('password').value);
            if (result.success) window.location.href = 'board.html';
            else { errorMsg.textContent = result.error; errorMsg.classList.remove('hidden'); }
        });
    </script>
</body>
</html>
